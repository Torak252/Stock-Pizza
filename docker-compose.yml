services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: pizza
      POSTGRES_PASSWORD: pizza
      POSTGRES_DB: pizza
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/timescale_init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./infra/hypertables.sql:/docker-entrypoint-initdb.d/hypertables.sql.manual:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizza"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }

  worker:
    build: ./backend
    env_file: .env
    command: ["python", "-m", "pizza_tracker.cli", "worker"]
    depends_on: { db: { condition: service_healthy } }

  web:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
