# Optional alternative to ./start.sh. API and worker share one SQLite file on a volume.
services:
  api:
    build: ./backend
    env_file: { path: ./backend/.env, required: false }
    environment: &db { SPT_DATABASE_URL: "sqlite:////data/pizza_tracker.db" }
    volumes: [data:/data]
    ports: ["127.0.0.1:8000:8000"]

  worker:
    build: ./backend
    env_file: { path: ./backend/.env, required: false }
    environment: *db
    volumes: [data:/data]
    command: ["python", "-m", "pizza_tracker.cli", "worker"]
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

volumes:
  data:
